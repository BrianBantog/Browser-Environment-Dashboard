<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Table Loader</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom right, #4ae635, #616161);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 80%;
    max-width: 900px;
    background: rgb(255, 255, 255);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  button {
    margin: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #3db92d;
    color: rgb(255, 255, 255);
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }

  button:hover {
    background-color: #32c025;
  }

  input {
    padding: 8px;
    margin: 5px;
    border-radius: 6px;
    border: 1px solid #707070;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #333;
    padding: 10px;
  }

  th {
    background: #f1f1f1;
  }

  #message {
    margin-top: 10px;
    font-weight: bold;
    color: red;
  }

  /* bottom clear button container */
  #bottomControls {
    margin-top: 15px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Product Table Loader Part 2</h1>

  <div>
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="price" placeholder="Price">
    <input type="text" id="category" placeholder="Category">
    <br>
    <button onclick="addProduct()">Add Product</button>
  </div>

  <br>

  <div>
    <button onclick="loadWithInnerHTML()">Load innerHTML</button>
    <button onclick="loadWithDOM()">Load DOM</button>
  </div>

  <div>
    <button onclick="testInnerHTML()">Test innerHTML</button>
    <button onclick="testDOM()">Test DOM</button>
  </div>

  <div id="message"></div>
  <div id="tableContainer"></div>

  <div id="bottomControls"></div>
</div>

<script>
let products = [
  { name: "Laptop", price: "₱15,000", category: "Electronics" },
  { name: "Shoes", price: "₱150", category: "Fashion" },
  { name: "Watch", price: "₱160", category: "Accessories" },
  { name: "Phone", price: "₱10,000", category: "Electronics" },
  { name: "Backpack", price: "₱120", category: "Bags" }
];

let lastMethod = "innerHTML";

function addProduct() {
  const name = document.getElementById("name").value.trim();
  let price = document.getElementById("price").value.trim();
  const category = document.getElementById("category").value.trim();

  const message = document.getElementById("message");

  if (name === "" && price === "" && category === "") {
    message.textContent = "Please input the Product Name, Price, and Category.";
    return;
  }

  if (name === "") {
    message.textContent = "Please input Product Name.";
    return;
  }

  if (price === "") {
    message.textContent = "Please input Price.";
    return;
  }

  if (isNaN(price)) {
    message.textContent = "Price must contain numbers only.";
    return;
  }

  if (category === "") {
    message.textContent = "Please input Category.";
    return;
  }

  price = "₱" + Number(price).toLocaleString();

  products.push({ name, price, category });

  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("category").value = "";

  message.textContent = "";

  if (lastMethod === "innerHTML") {
    loadWithInnerHTML();
  } else {
    loadWithDOM();
  }
}

function deleteProduct(index) {
  products.splice(index, 1);

  if (lastMethod === "innerHTML") {
    loadWithInnerHTML();
  } else {
    loadWithDOM();
  }
}

function showClearButton() {
  const bottom = document.getElementById("bottomControls");

  bottom.innerHTML = `
    <button onclick="clearTable()">Clear Table</button>
  `;
}

function clearTable() {
  document.getElementById("tableContainer").innerHTML = "";
  document.getElementById("bottomControls").innerHTML = "";
}

function loadWithInnerHTML() {
  lastMethod = "innerHTML";

  let html = "<table>";
  html += "<tr><th>Name</th><th>Price</th><th>Category</th><th>Action</th></tr>";

  products.forEach((p, i) => {
    html += `
      <tr>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>${p.category}</td>
        <td><button onclick="deleteProduct(${i})">Delete</button></td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("tableContainer").innerHTML = html;
  showClearButton();
}

function loadWithDOM() {
  lastMethod = "DOM";

  const container = document.getElementById("tableContainer");
  container.innerHTML = "";

  const table = document.createElement("table");

  const header = document.createElement("tr");
  ["Name", "Price", "Category", "Action"].forEach(t => {
    const th = document.createElement("th");
    th.textContent = t;
    header.appendChild(th);
  });

  table.appendChild(header);

  products.forEach((p, i) => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${p.name}</td>
      <td>${p.price}</td>
      <td>${p.category}</td>
    `;

    const action = document.createElement("td");
    const btn = document.createElement("button");
    btn.textContent = "Delete";
    btn.onclick = () => deleteProduct(i);
    action.appendChild(btn);

    row.appendChild(action);
    table.appendChild(row);
  });

  container.appendChild(table);
  showClearButton();
}

function generateTestData(count) {
  const data = [];
  for (let i = 0; i < count; i++) {
    const price = Math.floor(Math.random() * 20000 + 100);
    data.push({
      name: "Product " + (i + 1),
      price: "₱" + price.toLocaleString(),
      category: "Example"
    });
  }
  return data;
}

function testInnerHTML() {
  lastMethod = "innerHTML";

  const testData = generateTestData(Math.floor(Math.random() * 51) + 50);

  console.time("innerHTML");

  let html = "<table><tr><th>Name</th><th>Price</th><th>Category</th></tr>";

  testData.forEach(p => {
    html += `
      <tr>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>${p.category}</td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("tableContainer").innerHTML = html;

  console.timeEnd("innerHTML");

  showClearButton();
}

function testDOM() {
  lastMethod = "DOM";

  const testData = generateTestData(Math.floor(Math.random() * 51) + 50);

  console.time("DOM");

  const container = document.getElementById("tableContainer");
  container.innerHTML = "";

  const table = document.createElement("table");

  const header = document.createElement("tr");
  ["Name", "Price", "Category"].forEach(t => {
    const th = document.createElement("th");
    th.textContent = t;
    header.appendChild(th);
  });

  table.appendChild(header);

  testData.forEach(p => {
    const row = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = p.name;

    const td2 = document.createElement("td");
    td2.textContent = p.price;

    const td3 = document.createElement("td");
    td3.textContent = p.category;

    row.appendChild(td1);
    row.appendChild(td2);
    row.appendChild(td3);

    table.appendChild(row);
  });

  container.appendChild(table);

  console.timeEnd("DOM");

  showClearButton();
}
</script>

</body>
</html>
